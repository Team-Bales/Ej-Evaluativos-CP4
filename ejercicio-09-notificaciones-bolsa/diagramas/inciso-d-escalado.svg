<text x="1030" y="626" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1f2937">1 000 000</text>

<text x="590" y="656" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#6b7280">clientes suscritos a la acción (n)</text>
<text x="34" y="355" text-anchor="middle" transform="rotate(-90 34 355)" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#6b7280">tiempo de un cambio de precio</text>

<!-- === Anotación === -->
<text x="178" y="152" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">En estos ejes, una recta de pendiente 1 crece como O(n); una recta horizontal es coste constante.</text>
<text x="178" y="174" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#6b7280">Con n = 1 000 000 y k = 50 (escenario A): 112,3 ms recorriendo la lista frente a 0,15 ms con el índice.</text>
<text x="178" y="192" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#6b7280">En el escenario B, k crece con n, así que las dos curvas vuelven a ser rectas de pendiente 1.</text>

