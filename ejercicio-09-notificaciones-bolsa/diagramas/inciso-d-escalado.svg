<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
<rect width="1200" height="740" fill="#ffffff"/>

<text x="40" y="42" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="21" font-weight="bold" fill="#1f2937">Ejercicio 9 · inciso d · Coste de un cambio de precio según el número de clientes</text>
<text x="40" y="66" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#6b7280">Los dos ejes en escala logarítmica. Mediana de 11 ticks en un Intel Core i5-7300U con .NET 10; k son los clientes que de verdad hay que avisar.</text>

