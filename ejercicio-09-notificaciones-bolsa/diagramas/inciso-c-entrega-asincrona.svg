<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740">
<defs>
<marker id="flecha" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L9,3.5 L0,7 z" fill="#4b5563"/>
</marker>
<marker id="flecha-ambar" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L9,3.5 L0,7 z" fill="#b7862a"/>
</marker>
</defs>

<rect width="1280" height="740" fill="#ffffff"/>
<text x="40" y="44" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="22" font-weight="bold" fill="#1f2937">Ejercicio 9 · inciso c · Entrega asíncrona y aislamiento de fallos</text>
<text x="40" y="68" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#6b7280">La alerta solo encola y regresa; el envío ocurre en segundo plano. Cada envío va aislado y se reintenta antes de darse por perdido.</text>

<!-- ================= Zona 1: el hilo del sujeto ================= -->
<rect x="24" y="88" width="430" height="562" rx="14" fill="#f4f7fd" stroke="#3d5fb0" stroke-width="1.2"/>
<text x="44" y="116" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" fill="#3d5fb0">1 · Hilo que cambia el precio · SÍNCRONO</text>
<text x="44" y="136" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#6b7280">El Observer de GoF: llamadas de método, una tras otra.</text>

<g>
<rect x="51" y="156" width="382" height="96" rx="8" fill="#000" opacity="0.06"/>
<rect x="48" y="152" width="382" height="96" rx="8" fill="#fff" stroke="#3d5fb0" stroke-width="1.6"/>
<path d="M48,186 V160 Q48,152 56,152 H422 Q430,152 430,160 V186 Z" fill="#dbe5fb" stroke="#3d5fb0" stroke-width="1.6"/>
<text x="239" y="176" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" fill="#1f2937">Accion  (ConcreteSubject)</text>
<text x="64" y="212" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" fill="#1f2937">ActualizarPrecio(155.00)</text>
<text x="64" y="234" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" fill="#1f2937">Notificar(cambio): try/catch por observador</text>
</g>

<path d="M239,248 V284" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#flecha)"/>

<g>
<rect x="51" y="292" width="382" height="96" rx="8" fill="#000" opacity="0.06"/>
<rect x="48" y="288" width="382" height="96" rx="8" fill="#fff" stroke="#3d5fb0" stroke-width="1.6"/>
<path d="M48,322 V296 Q48,288 56,288 H422 Q430,288 430,296 V322 Z" fill="#dbe5fb" stroke="#3d5fb0" stroke-width="1.6"/>
<text x="239" y="312" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" font-weight="bold" fill="#1f2937">AlertaUmbral  (×1500)</text>
<text x="64" y="348" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" fill="#1f2937">¿cruzó mi umbral? 2 comparaciones</text>
<text x="64" y="370" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" fill="#1f2937">sí → Encolar(Notificacion)</text>
</g>

<path d="M239,388 V424" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#flecha)"/>

<g>
<rect x="51" y="432" width="382" height="96" rx="8" fill="#000" opacity="0.06"/>
<rect x="48" y="428" width="382" height="96" rx="8" fill="#fff" stroke="#3d5fb0" stroke-width="1.6"/>
<path d="M48,462 V436 Q48,428 56,428 H422 Q430,428 430,436 V462 Z" fill="#dbe5fb" stroke="#3d5fb0" stroke-width="1.6"/>
<text x="239" y="452" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">IDespachadorNotificaciones.Encolar</text>
<text x="64" y="488" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" fill="#1f2937">TryWrite(envio) y regresa</text>
<text x="64" y="510" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" fill="#1f2937">cola llena → rechaza y registra</text>
</g>

<rect x="48" y="548" width="382" height="78" rx="8" fill="#ffffff" stroke="#3d5fb0" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="64" y="572" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="bold" fill="#3d5fb0">Lo que nunca ocurre aquí</text>
<text x="64" y="592" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#6b7280">Esperar a un canal. Ni perder a los demás</text>
<text x="64" y="610" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#6b7280">suscriptores porque uno falle.</text>

<!-- ================= La cola: la frontera ================= -->
<text x="617" y="288" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" font-weight="bold" fill="#b7862a">frontera asíncrona</text>
<g>
<rect x="495" y="304" width="250" height="150" rx="8" fill="#000" opacity="0.06"/>
